<article class="conta-card">
  <span class="conta-card__logo" aria-hidden="true">
    @if (logo()) {
      <img [src]="logo()" alt="" />
    } @else {
      {{ initial() }}
    }
  </span>
  <div class="conta-card__body">
    <p class="conta-card__title">{{ appointment().serviceName }} · {{ appointment().company.name }}</p>
    <p class="conta-card__meta">{{ date() }} às {{ appointment().time }} · {{ appointment().professionalName }} · {{ price() }}</p>
  </div>
  <div class="conta-card__side">
    <span class="conta-status" [class.conta-status--off]="!activeStatus()">{{ statusLabel() }}</span>
    <a class="conta-link" [routerLink]="companyLink()">Ver na empresa</a>
  </div>
</article>
