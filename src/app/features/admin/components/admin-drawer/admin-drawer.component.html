<div class="admin-drawer-overlay" role="presentation" @overlayAnimation>
  <aside
    class="admin-drawer"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    @panelAnimation
  >
    <header class="admin-drawer__header">
      <div>
        @if (eyebrow) {
          <p>{{ eyebrow }}</p>
        }
        <h2 [id]="titleId" tabindex="-1">{{ title }}</h2>
      </div>
      <app-close-button [label]="closeAriaLabel" (closeClick)="close()" />
    </header>

    <section class="admin-drawer__content">
      <ng-content select="[drawer-content]" />
    </section>

    @if (errorMessage) {
      <p class="admin-drawer__error" role="alert">{{ errorMessage }}</p>
    }

    <footer class="admin-drawer__footer">
      <ng-content select="[drawer-footer]" />
    </footer>
  </aside>
</div>
