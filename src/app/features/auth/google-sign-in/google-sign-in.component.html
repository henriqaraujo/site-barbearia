@if (isAvailable() && !pendingDocuments()) {
  <p class="google-divider"><span>ou</span></p>
}

<div class="google-button" #googleButton [hidden]="!isAvailable() || !!pendingDocuments()" [class.is-busy]="isSubmitting()"></div>

@if (pendingDocuments(); as documents) {
  <app-customer-legal-acceptance
    [documents]="documents"
    [isSubmitting]="isSubmitting()"
    submitLabel="Aceitar e continuar com Google"
    (accepted)="acceptDocuments($event)"
    (cancelled)="cancelAcceptance()"
  />
}

@if (errorMessage()) {
  <p class="form-error" role="alert">{{ errorMessage() }}</p>
}
