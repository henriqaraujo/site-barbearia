<ng-content />
<button
  class="password-toggle"
  type="button"
  [attr.aria-label]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
  [attr.title]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
  [attr.aria-pressed]="visible()"
  (mousedown)="keepFocus($event)"
  (click)="toggle()"
>
  <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="20" />
</button>
