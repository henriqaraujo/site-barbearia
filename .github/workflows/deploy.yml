name: Deploy via FTP (Locaweb)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build da demonstração (base /barbearia/)
        run: npm run build:demo

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist/hl-gestao/browser"
          remoteDir: "public_html/barbearia"
